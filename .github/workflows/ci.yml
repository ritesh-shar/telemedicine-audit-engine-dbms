
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: telemedicine_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d telemedicine_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Set up live database
        env:
          PGPASSWORD: postgres
        working-directory: .
        run: |
          for migration in database/postgres/migrations/*.sql; do
            psql -h 127.0.0.1 -U postgres -d telemedicine_ci -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql -h 127.0.0.1 -U postgres -d telemedicine_ci -v ON_ERROR_STOP=1 \
            -f database/postgres/seeds/020_doctors.sql

          psql -h 127.0.0.1 -U postgres -d telemedicine_ci \
            -f database/postgres/triggers/audit_triggers.sql

          psql -h 127.0.0.1 -U postgres -d telemedicine_ci \
            -f database/postgres/views/patient_prescription_history.sql

      - name: Production build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemedicine_ci
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: telemedicine_ci
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters-long
        run: npm run build

      - name: Live authentication and appointment workflow
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/telemedicine_ci
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: telemedicine_ci
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters-long
          COOKIE_SECURE: "false"
        run: |
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 27017; then
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 27017

          npm run start -- --port 3000 &

          node -e "const wait=ms=>new Promise(r=>setTimeout(r,ms)); (async()=>{for(let i=0;i<60;i++){try{if((await fetch('http://127.0.0.1:3000/login')).ok)process.exit(0)}catch{} await wait(500)}process.exit(1)})()"

          npm run test:http
