name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          DATABASE_URL: postgresql://telemedicine_ci:telemedicine_ci@localhost:5432/telemedicine_ci
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: telemedicine_ci
          SESSION_SECRET: ci-session-secret-that-is-at-least-32-characters-long
        run: npm run build
